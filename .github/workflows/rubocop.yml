---
name: lint
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rubocop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop